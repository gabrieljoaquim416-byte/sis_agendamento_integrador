
{% extends "base.html" %}

{% block title %}Editar Agendamento{% endblock %}

{% block content %}

<div class="welcome">
    <div>
        <h1>Editar agendamento</h1>
        <p>Atualize as informações do agendamento selecionado.</p>
    </div>

    <a href="{{ url_for('listar_agendamentos') }}"
       class="btn-secondary">
        Voltar
    </a>
</div>

<div class="form-container">

    <form method="POST"
          action="{{ url_for('editar_agendamento', id=agendamento.id) }}">

        <div class="form-grid">

            <div class="form-group">
                <label>Nome do cliente *</label>
                <input
                    type="text"
                    name="nome_cliente"
                    maxlength="100"
                    value="{{ agendamento.nome_cliente }}"
                    required>
            </div>

            <div class="form-group">
                <label>Telefone *</label>
                <input
                    type="tel"
                    name="telefone"
                    maxlength="20"
                    value="{{ agendamento.telefone }}"
                    required>
            </div>

            <div class="form-group">
                <label>Serviço *</label>
                <input
                    type="text"
                    name="servico"
                    maxlength="100"
                    value="{{ agendamento.servico }}"
                    required>
            </div>

            <div class="form-group">
                <label>Data do agendamento *</label>
                <input
                    type="date"
                    name="data_agendamento"
                    value="{{ agendamento.data_agendamento.strftime('%Y-%m-%d') }}"
                    required>
            </div>

            <div class="form-group">
                <label>Horário *</label>
                <input
                    type="time"
                    name="horario"
                    value="{{ agendamento.horario }}"
                    required>
            </div>

            <div class="form-group full-width">
                <label>Observações</label>
                <textarea
                    name="observacoes"
                    rows="4">{{ agendamento.observacoes or '' }}</textarea>
            </div>

        </div>

        <p class="form-note">* Campos obrigatórios</p>

        <div class="form-actions">

            <a href="{{ url_for('listar_agendamentos') }}"
               class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Salvar alterações
            </button>

        </div>

    </form>

</div>

{% endblock %}
